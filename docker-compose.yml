services:
  postgres:
    image: postgres:16

    container_name: game_db

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: game_db

    ports:
      - "5436:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: