<svg viewBox="0 0 920 1060" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="920" height="1060" fill="#ffffff"/>

  <text x="460" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Request / Response Data Flow</text>
  <text x="460" y="66" text-anchor="middle" font-size="14" fill="#64748b">FastAPI Game Catalog API — Pydantic ↔ SQLAlchemy</text>

  <!-- Legend -->
  <rect x="620" y="20" width="14" height="14" rx="3" fill="#3b82f6"/>
  <text x="640" y="31" font-size="12" fill="#334155">Pydantic layer</text>
  <rect x="750" y="20" width="14" height="14" rx="3" fill="#16a34a"/>
  <text x="770" y="31" font-size="12" fill="#334155">SQLAlchemy layer</text>

  <!-- Client -->
  <rect x="360" y="95" width="200" height="56" rx="10" fill="#0f172a"/>
  <text x="460" y="129" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="600">Client</text>
  <text x="460" y="145" text-anchor="middle" font-size="11" fill="#cbd5e1">JSON request</text>

  <line x1="460" y1="151" x2="460" y2="185" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Route -->
  <rect x="330" y="185" width="260" height="60" rx="10" fill="#f1f5f9" stroke="#3b82f6" stroke-width="2"/>
  <text x="460" y="212" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">routes/game.py</text>
  <text x="460" y="230" text-anchor="middle" font-size="11" fill="#475569">FastAPI endpoint receives request</text>

  <line x1="460" y1="245" x2="460" y2="279" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Pydantic validation -->
  <rect x="300" y="279" width="320" height="66" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="460" y="304" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Pydantic Schema Validation</text>
  <text x="460" y="321" text-anchor="middle" font-size="11" fill="#1e40af">GameCreate / GameUpdate</text>
  <text x="460" y="336" text-anchor="middle" font-size="11" fill="#1e40af">type-checks + parses input body</text>

  <line x1="460" y1="345" x2="460" y2="379" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Service -->
  <rect x="330" y="379" width="260" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="460" y="406" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">services/game.py</text>
  <text x="460" y="424" text-anchor="middle" font-size="11" fill="#475569">business logic, coordinates the call</text>

  <line x1="460" y1="439" x2="460" y2="473" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Repository -->
  <rect x="330" y="473" width="260" height="60" rx="10" fill="#f1f5f9" stroke="#16a34a" stroke-width="2"/>
  <text x="460" y="500" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">repositories/game.py</text>
  <text x="460" y="518" text-anchor="middle" font-size="11" fill="#475569">builds the query</text>

  <line x1="460" y1="533" x2="460" y2="567" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SQLAlchemy -->
  <rect x="300" y="567" width="320" height="66" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="460" y="592" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">SQLAlchemy ORM</text>
  <text x="460" y="609" text-anchor="middle" font-size="11" fill="#166534">Session builds SQL from Game model</text>
  <text x="460" y="624" text-anchor="middle" font-size="11" fill="#166534">db.add() / db.query() / db.commit()</text>

  <line x1="460" y1="633" x2="460" y2="667" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PostgreSQL -->
  <rect x="330" y="667" width="260" height="60" rx="10" fill="#0f172a"/>
  <text x="460" y="694" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">PostgreSQL</text>
  <text x="460" y="712" text-anchor="middle" font-size="11" fill="#cbd5e1">games table — source of truth</text>

  <!-- Return path -->
  <path d="M 590 697 C 760 697, 800 500, 760 340 C 745 260, 660 220, 596 210"
        fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrow)"/>
  <text x="805" y="480" font-size="12" fill="#64748b" transform="rotate(90 805 480)" text-anchor="middle">response path</text>

  <!-- Response schema note -->
  <rect x="650" y="130" width="230" height="76" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="765" y="153" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">GameResponse</text>
  <text x="765" y="170" text-anchor="middle" font-size="11" fill="#1e40af">Pydantic serializes the</text>
  <text x="765" y="185" text-anchor="middle" font-size="11" fill="#1e40af">SQLAlchemy model into</text>
  <text x="765" y="200" text-anchor="middle" font-size="11" fill="#1e40af">clean JSON for the client</text>

  <line x1="460" y1="151" x2="460" y2="151" stroke="none"/>

  <!-- Response arrow back to client -->
  <path d="M 460 95 C 460 60, 200 60, 200 150 C 200 200, 330 210, 330 210"
        fill="none" stroke="#94a3b8" stroke-width="0" opacity="0"/>

  <!-- Bottom summary strip -->
  <rect x="60" y="770" width="800" height="230" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="460" y="805" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Layer Responsibilities</text>

  <text x="90" y="840" font-size="12" fill="#0f172a" font-weight="600">1. Route</text>
  <text x="90" y="858" font-size="11" fill="#475569">Defines endpoint, path/query params, calls the service.</text>

  <text x="90" y="888" font-size="12" fill="#1e3a8a" font-weight="600">2. Pydantic (in)</text>
  <text x="90" y="906" font-size="11" fill="#475569">Validates and parses the incoming request body.</text>

  <text x="90" y="936" font-size="12" fill="#0f172a" font-weight="600">3. Service</text>
  <text x="90" y="954" font-size="11" fill="#475569">Business rules, e.g. 404 if a game doesn't exist.</text>

  <text x="480" y="840" font-size="12" fill="#0f172a" font-weight="600">4. Repository</text>
  <text x="480" y="858" font-size="11" fill="#475569">Constructs filters, sorting, and query logic.</text>

  <text x="480" y="888" font-size="12" fill="#166534" font-weight="600">5. SQLAlchemy</text>
  <text x="480" y="906" font-size="11" fill="#475569">Maps Python objects to SQL, talks to PostgreSQL.</text>

  <text x="480" y="936" font-size="12" fill="#1e3a8a" font-weight="600">6. Pydantic (out)</text>
  <text x="480" y="954" font-size="11" fill="#475569">Serializes the ORM model into the JSON response.</text>

  <text x="460" y="990" text-anchor="middle" font-size="11" fill="#94a3b8">Each layer only talks to the one directly above and below it.</text>
</svg>